version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: partneropsa-postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: partneropsa_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/infrastructure/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - partneropsa

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: partneropsa-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@test.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - partneropsa

volumes:
  postgres_data:

networks:
  partneropsa:
    driver: bridge
