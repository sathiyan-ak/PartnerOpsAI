[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True
no_implicit_optional = False
disallow_incomplete_defs = False

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-psycopg2.*]
ignore_missing_imports = True

[mypy-uvicorn]
ignore_missing_imports = True

[mypy-supabase.*]
ignore_missing_imports = True
